name: Deploy Huff n Puff to GitHub Pages

# Builds the static site and publishes it to the gh-pages branch,
# which GitHub Pages serves (Settings → Pages → Deploy from a branch → gh-pages).
on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js fonts icons audio _site/
          # unique cache name per deploy so installed apps pick up the update
          sed -i "s/const VERSION = 'pulse-v[^']*'/const VERSION = 'pulse-${GITHUB_SHA::8}'/" _site/sw.js
          # custom domain: set the repository variable PAGES_DOMAIN (e.g. huffnpuff.club) once its DNS
          # points at GitHub Pages. Written on every deploy, as each one replaces the gh-pages branch.
          if [ -n "${{ vars.PAGES_DOMAIN }}" ]; then echo "${{ vars.PAGES_DOMAIN }}" > _site/CNAME; fi

      # Voice coach: pre-record every line with several Microsoft Edge neural voices (edge-tts);
      # the app lets you pick one.
      # Clips are cached between deploys, so only new or changed lines are recorded.
      # If the (unofficial) service fails, the deploy still ships and the app uses the device voice.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore voice clips
        uses: actions/cache@v4
        with:
          path: .voice-cache
          key: voices-v2-${{ vars.TTS_VOICES || 'default' }}-${{ vars.TTS_RATE || '+0%' }}-${{ github.run_id }}
          restore-keys: voices-v2-${{ vars.TTS_VOICES || 'default' }}-${{ vars.TTS_RATE || '+0%' }}-
      - name: Record voice coach
        continue-on-error: true
        env:
          TTS_VOICES: ${{ vars.TTS_VOICES }}
          TTS_RATE: ${{ vars.TTS_RATE }}
        run: |
          pip install -q 'edge-tts>=7,<8'
          node tools/voice-lines.mjs > voice-lines.json
          python tools/build-audio.py voice-lines.json _site/audio/voice .voice-cache | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          owner="${GITHUB_REPOSITORY_OWNER,,}"; repo="${GITHUB_REPOSITORY#*/}"
          if [ -f CNAME ]; then echo "::notice::Published to https://$(cat CNAME)/"; else echo "::notice::Published to https://${owner}.github.io/${repo}/"; fi
