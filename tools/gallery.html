<!doctype html>
<html><head><meta charset="utf-8"><title>Pulse clay gallery</title>
<style>body{font-family:sans-serif;margin:8px;background:#fff}.g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.c{border:1px solid #ddd;border-radius:8px;overflow:hidden;font-size:11px}.c svg{display:block;width:100%}.row{display:flex}.row>div{flex:1}</style></head>
<body><div class="g" id="g"></div>
<script type="module">
import { EXERCISES } from '../js/exercises.js';
import { clayStill, STATIC_FILTER } from '../js/clay.js';
document.body.insertAdjacentHTML('afterbegin', STATIC_FILTER);
const q = new URLSearchParams(location.search);
const only = q.get('ex');
const list = only ? EXERCISES.filter(e => only.split(',').includes(e.id)) : EXERCISES;
const g = document.getElementById('g'); if (q.get('cols')) g.style.gridTemplateColumns = 'repeat(' + q.get('cols') + ',1fr)';
for (const ex of list) {
  const n = Math.max(2, ex.anim.frames.length);
  let html = '';
  const phases = q.get('all') ? Array.from({length:n},(_, i)=>i/n) : [0, (ex.anim.frames.length>1? 0.5: 0)];
  for (const ph of (q.get('all')? phases : [undefined])) html += `<div>${clayStill(ex, undefined, ph)}</div>`;
  g.insertAdjacentHTML('beforeend', `<div class="c"><div class="row">${html}</div>${ex.id}</div>`);
}
window.done = true;
</script></body></html>
