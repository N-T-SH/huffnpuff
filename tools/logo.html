<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../css/brand.css">
<style>body{margin:0;background:#fff5ea;font-family:sans-serif}.row{display:flex;gap:40px;padding:40px;align-items:center;flex-wrap:wrap}.dark{background:#1a1524}
.icon{width:512px;height:512px;border-radius:112px;position:relative;overflow:hidden;display:grid;place-items:center;
 background:radial-gradient(70% 60% at 25% 20%,#ff8cc4 0,transparent 60%),radial-gradient(70% 60% at 80% 85%,#ffcf4a 0,transparent 60%),radial-gradient(60% 60% at 85% 15%,#5ee6d6 0,transparent 55%),#7b3fe4}
.icon .mono{font-family:'Spray';font-size:250px;line-height:1;transform:rotate(-8deg);display:flex;align-items:baseline}
.icon .mono span{-webkit-text-stroke:5px #2a1636;paint-order:stroke fill;text-shadow:-5px -6px 0 rgba(255,255,255,.4),7px 10px 0 #2a1636,12px 17px 0 #2a1636;filter:drop-shadow(0 0 6px #2a1636) drop-shadow(0 0 2px #2a1636) drop-shadow(10px 16px 10px rgba(42,22,54,.4))}
.icon .s1{color:#ff5fa8}.icon .s2{color:#ffb21f;font-size:.86em;margin-left:-.06em;transform:translateY(-.08em) rotate(6deg);display:inline-block}.icon .c{color:#22c7b4;font-size:.92em;margin-left:-.04em}
.icon .mist{position:absolute;inset:0;background:radial-gradient(circle at 20% 80%,rgba(255,255,255,.25) 0 2px,transparent 3px) 0 0/22px 22px;opacity:.5}
</style></head><body>
<div class="row"><div class="ssc-logo" style="font-size:110px"><span class="w super">Super</span><span class="w sweat">Sweat</span><span class="w club">Club</span></div>
<div class="ssc-line" style="font-size:54px"><span class="a">Super</span><span class="b">Sweat</span><span class="c">Club</span></div></div>
<div class="row dark"><div class="ssc-logo" style="font-size:80px"><span class="w super">Super</span><span class="w sweat">Sweat</span><span class="w club">Club</span></div>
<div class="icon" id="icon"><div class="mist"></div><div class="mono"><span class="s1">S</span><span class="s2">S</span><span class="c">C</span></div></div></div>
<script>document.fonts.ready.then(()=>window.done=true)</script></body></html>
