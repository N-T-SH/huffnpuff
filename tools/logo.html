<!doctype html><html><head><meta charset="utf-8"><title>Huff n Puff logo</title>
<!-- Preview of the Huff n Puff logo (drawn by tools/hnp-logo.js) on the backgrounds it's used on. -->
<style>body{margin:0;font-family:sans-serif;background:#fff5ea}.row{display:flex;gap:16px;padding:16px}
.c{width:360px;height:300px;border-radius:24px;display:grid;place-items:center}.c canvas{width:300px;transform:rotate(-5deg)}
.y{background:#ffb21f}.cr{background:#fff5ea;border:1px solid #f1e2d4}.d{background:#1a1524}</style></head><body>
<div class="row" id="row"></div>
<script type="module">
import { drawLogo } from './hnp-logo.js';
for (const cls of ['y', 'cr', 'd']) { const c = document.createElement('div'); c.className = 'c ' + cls; c.append(drawLogo(1)); row.append(c); }
window.done = true;
</script></body></html>
