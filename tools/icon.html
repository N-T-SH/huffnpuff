<!doctype html><html><head><meta charset="utf-8"><title>Huff n Puff icons</title>
<!-- Huff n Puff app icon preview: the logo on the brand yellow. ?mask=1 shows the full-bleed maskable variant.
     tools/render-icons.mjs uses window.icon(size, mask) to write the PNGs. -->
<style>html,body{margin:0;background:#eee}canvas{margin:12px}</style></head><body>
<script type="module">
import { drawLogo, paintYellow } from './hnp-logo.js';
const art = drawLogo(1.4, -6);
// size: px · mask: full bleed with the art inside Android's safe circle · round: corner radius share
window.icon = (size, mask = false) => {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  if (!mask) { const r = size * 0.22; x.beginPath(); x.roundRect(0, 0, size, size, r); x.clip(); }
  paintYellow(x, size, size);
  const w = size * (mask ? 1.02 : 0.96), h = w * art.height / art.width;
  x.translate(size / 2, size / 2 + size * 0.01);
  x.drawImage(art, -w / 2, -h / 2, w, h);
  return c;
};
// the in-app logo: tilted -5°, sized for a phone at 3x, as WebP (a quarter of the PNG's weight)
window.logo = () => drawLogo(1.25).toDataURL('image/webp', 0.9);
document.body.append(window.icon(256), window.icon(256, true));
window.done = true;
</script></body></html>
